[workspace]
members = ["crates/persimmon-core", "crates/persimmon-cli"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Persimmon contributors"]
repository = "https://github.com/persimmon-app/persimmon"
readme = "README.md"
keywords = ["convert", "file-conversion", "offline", "media", "cli"]

[workspace.lints.rust]
unsafe_code = "forbid"
