[package]
name = "persimmon-core"
description = "The conversion engine behind Persimmon: platform-neutral, offline file conversion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["multimedia"]

[features]
default = ["vips"]
# The libvips image backend (DD-34). Needs libvips installed (Homebrew
# `vips`, apt `libvips-dev`); build with --no-default-features without it.
vips = ["dep:rs-vips", "dep:image"]

[dependencies]
unicode-normalization = "0.1"
rs-vips = { version = "0.7", optional = true }
# Only BMP: libvips has no BMP loader of its own (DD-34).
image = { version = "0.25", default-features = false, features = ["bmp"], optional = true }

[dev-dependencies]
persimmon-corpus = { path = "../persimmon-corpus" }

[lints]
workspace = true
