[package]
name = "persimmon-core"
description = "The conversion engine behind Persimmon: platform-neutral, offline file conversion."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["multimedia"]

[features]
default = ["vips", "rar"]
# The libvips image backend (DD-34). Needs libvips installed (Homebrew
# `vips`, apt `libvips-dev`); build with --no-default-features without it.
vips = ["dep:rs-vips"]
# RAR and RAR5 through the system libarchive's own reader, never unRAR
# (DD-37, BL-T20). Needs libarchive 3.6 or later (Homebrew `libarchive`,
# apt `libarchive-dev`); build with --no-default-features without it.
rar = ["dep:compress-tools"]

[dependencies]
unicode-normalization = "0.1"
# The PDF backend (DD-36): hayro reads and renders pages, lopdf builds and
# rewrites documents. Both pure Rust, compiled in, nothing to install.
hayro = "0.9"
lopdf = { version = "0.47", default-features = false }
# The archive backend (DD-37): pure-Rust readers for ZIP, the tar family
# and 7z, and writers for ZIP and tar.gz.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "ppmd", "deflate", "util"] }
compress-tools = { version = "0.16", optional = true }
rs-vips = { version = "0.7", optional = true }
# BMP decoding, which libvips can't do without ImageMagick (DD-34), and
# PNG and JPEG for rendered PDF pages, which needs no libvips (DD-36).
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }

[dev-dependencies]
persimmon-corpus = { path = "../persimmon-corpus" }

[lints]
workspace = true
