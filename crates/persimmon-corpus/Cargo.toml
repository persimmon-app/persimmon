[package]
name = "persimmon-corpus"
description = "Generates Persimmon's ugly-file test corpus (BL-T10). Test-only; never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# No dependency on persimmon-core: the core's tests depend on this crate.

[dependencies]
# Writes the PDF samples.
lopdf = { version = "0.47", default-features = false }
# Write the archive samples.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma", "xz"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bzip2 = "0.6"
lzma-rust2 = "0.25"
ruzstd = "0.9"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "aes256", "util"] }

[lints]
workspace = true
