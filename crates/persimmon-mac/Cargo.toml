[package]
name = "persimmon-mac"
description = "Persimmon's native macOS layer: the one crate where unsafe code may be allowed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["objc2-core-services", "NSAppleEventDescriptor", "NSAppleEventManager", "NSBundle", "NSError", "NSSet", "NSString", "NSDictionary", "NSArray", "NSOperation", "NSURL", "NSGeometry", "NSObject", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSPasteboard", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSGraphics", "NSDragging", "NSFilePromiseReceiver", "NSApplication", "block2"] }
raw-window-handle = "0.6"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

# The workspace forbids unsafe code; this crate denies it instead, so a block
# that needs it can carry #[allow(unsafe_code)] and a // SAFETY: comment.
[lints.rust]
unsafe_code = "deny"
