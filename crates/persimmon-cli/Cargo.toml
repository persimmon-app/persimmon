[package]
name = "persimmon-cli"
description = "prsm, the Persimmon command line: offline file conversion you can script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "multimedia"]

# The binary is `prsm`, not `psm` (DD-23): macOS ships /usr/bin/psm.
[[bin]]
name = "prsm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
persimmon-core = { path = "../persimmon-core", version = "0.0.1" }

[dev-dependencies]
persimmon-corpus = { path = "../persimmon-corpus" }

[lints]
workspace = true
