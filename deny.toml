# cargo-deny configuration: the licence guard for Rust dependencies (DD-04).
# CI runs `cargo deny check licenses` on Ubuntu for every push.
#
# Every licence here is compatible with GPL-3.0-or-later. Widening this list
# is an owner decision: never add a licence just to make
# a red build green.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    # libbz2-rs-sys, the pure-Rust bzip2 that reads .tar.bz2 and bzip2 in
    # ZIP and 7z. A BSD-style licence. Owner-approved with DD-37, 2026-11-09.
    "bzip2-1.0.6",
    # ppmd-rust (CC0-1.0 OR MIT-0), for 7z's PPMd method. Owner-approved
    # with DD-37, 2026-11-09.
    "MIT-0",
]
confidence-threshold = 0.9
