# CI on all three platforms from the first commit (DD-22), even though only
# macOS ships until the port. A red Windows or Linux run blocks a merge just
# like a red macOS run: that is what keeps Phase 5 a port and not a rewrite.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned to 26.04: FFmpeg must be 7 or later (DD-29), and
        # 24.04's apt FFmpeg is 6.1.
        os: [macos-latest, windows-latest, ubuntu-26.04]
        # The image backend links libvips (DD-34). Windows builds without it
        # until the port: linking libvips there is Phase 5 work.
        include:
          - os: windows-latest
            features: --no-default-features
    steps:
      - uses: actions/checkout@v6

      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Install libvips and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install vips ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      # The libheif plugins decode HEIC (libde265) and AVIF (dav1d), and
      # encode AVIF (aom).
      - name: Install libvips and FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-aomenc ffmpeg

      # Chocolatey puts a shim on PATH that starts the real ffmpeg.exe.
      # Killing the shim (as a cancel does) would leave FFmpeg running, so
      # the real binary's folder goes on PATH ahead of the shims.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg-full -y --no-progress
          $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg-full -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found under the ffmpeg-full package" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: FFmpeg version
        shell: bash
        run: |
          command -v ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings

      # The 4 GB sparse corpus file runs where the filesystem keeps it
      # sparse: APFS and ext4, not NTFS.
      # PERSIMMON_REQUIRE_FFMPEG turns "no ffmpeg, skip" into a failure.
      - name: Test
        run: cargo test --workspace --locked ${{ matrix.features }}
        env:
          PERSIMMON_CORPUS_LARGE: ${{ runner.os != 'Windows' && '1' || '' }}
          PERSIMMON_REQUIRE_FFMPEG: "1"

      # The licence guard (DD-04): every Rust dependency, direct or
      # transitive, must carry a licence on the deny.toml list. Once is
      # enough, so it runs on Ubuntu only.
      # RUSTFLAGS is cleared here: -D warnings is for our code, not for
      # building a tool.
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked
        env:
          RUSTFLAGS: ""

      - name: Check licences
        if: runner.os == 'Linux'
        run: cargo deny check licenses

      - name: Build release
        run: cargo build --workspace --release --locked ${{ matrix.features }}

      - name: Smoke test
        shell: bash
        run: ./target/release/prsm --version

      # DD-27: the minimum macOS is 14 Sonoma, declared through .cargo/config.toml.
      - name: Check macOS deployment target
        if: runner.os == 'macOS'
        run: vtool -show-build target/release/prsm | grep -q 'minos 14.0'

      - name: Upload prsm
        uses: actions/upload-artifact@v6
        with:
          name: prsm-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/prsm
            target/release/prsm.exe
          if-no-files-found: error
