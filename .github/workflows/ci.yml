# CI on all three platforms from the first commit (DD-22), even though only
# macOS ships until the port. A red Windows or Linux run blocks a merge just
# like a red macOS run: that is what keeps Phase 5 a port and not a rewrite.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --workspace --release --locked

      - name: Smoke test
        shell: bash
        run: ./target/release/prsm --version

      # DD-27: the minimum macOS is 14 Sonoma, declared through .cargo/config.toml.
      - name: Check macOS deployment target
        if: runner.os == 'macOS'
        run: vtool -show-build target/release/prsm | grep -q 'minos 14.0'

      - name: Upload prsm
        uses: actions/upload-artifact@v6
        with:
          name: prsm-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/prsm
            target/release/prsm.exe
          if-no-files-found: error
