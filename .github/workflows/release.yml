# The release archives (DD-30): macOS arm64 and x64, Windows x64 and
# Linux x64, each tested, packaged with its licences and a checksum. And the
# macOS app (D5, DD-44): a DMG with libvips, libarchive and FFmpeg built
# from source inside, the sources of everything bundled, and FFmpeg's
# configure line.
#
# A pushed v* tag builds them all and creates a *draft* GitHub Release; a
# maintainer reviews it and publishes it by hand. Run by hand
# (workflow_dispatch), it builds and uploads them as artifacts only, a dry
# run before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A tag that doesn't match the workspace version stops here, before
  # anything is built.
  check:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Version matches the tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(.github/scripts/version.sh "$GITHUB_REF_NAME")
          else
            version=$(.github/scripts/version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes exist
        run: .github/scripts/notes.sh "${{ steps.version.outputs.version }}" > /dev/null

  build:
    needs: check
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # GitHub's last x86_64 macOS image.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # No libvips or libarchive on Windows until the port. The C
          # runtime is linked in, so prsm.exe starts without the Visual C++
          # Redistributable.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: --no-default-features
            rustflags: -C target-feature=+crt-static
          # Ubuntu 26.04 for FFmpeg 7 in the tests; the binary needs 26.04's
          # libvips and libarchive, as the README says.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain
        run: rustup toolchain install

      # A runner image that changed architecture would build the wrong
      # archive under the right name.
      - name: Host is the target
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "host $host"
          test "$host" = "${{ matrix.target }}"

      - name: Install libvips, FFmpeg and libarchive (macOS)
        if: runner.os == 'macOS'
        # libarchive is keg-only, so pkg-config finds it only with its own
        # folder on the path. (compress-tools guesses /opt/homebrew, which
        # Intel Macs don't have.)
        run: |
          brew install vips ffmpeg libarchive pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - name: Install libvips, FFmpeg and libarchive (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev libheif-plugin-libde265 libheif-plugin-dav1d libheif-plugin-aomenc ffmpeg libarchive-dev

      # The real ffmpeg.exe ahead of Chocolatey's shims, as in CI.
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg-full -y --no-progress
          $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg-full -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found under the ffmpeg-full package" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        # The app isn't released yet: it's packaged from Phase 2 week 5.
        run: cargo test --workspace --exclude persimmon-app --locked ${{ matrix.features }}
        env:
          PERSIMMON_REQUIRE_FFMPEG: "1"

      - name: Build release
        run: cargo build -p persimmon-cli --release --locked ${{ matrix.features }}
        env:
          RUSTFLAGS: -D warnings ${{ matrix.rustflags }}

      # What the binary needs installed to start: the README's install
      # section has to match these.
      - name: Linked libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L target/release/prsm
          vtool -show-build target/release/prsm | grep -q 'minos 14.0'

      - name: Linked libraries (Linux)
        if: runner.os == 'Linux'
        run: ldd target/release/prsm

      # Nothing beyond what every Windows has: no VCRUNTIME140.dll.
      - name: Linked libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin /dependents target\release\prsm.exe
          $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "prsm.exe needs the Visual C++ runtime" }

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
        env:
          RUSTFLAGS: ""

      # cargo-about reads the whole dependency graph, every platform's
      # crates included, and the build above fetched only this one's.
      - name: Fetch every platform's crates
        run: cargo fetch --locked

      - name: Licence inventory
        run: cargo about generate --locked --offline -m crates/persimmon-cli/Cargo.toml ${{ matrix.features }} --target ${{ matrix.target }} about.hbs -o target/release/THIRD-PARTY-LICENSES.html

      - name: Package
        shell: bash
        run: .github/scripts/package.sh "${{ matrix.target }}" "${{ needs.check.outputs.version }}" target/release dist

      # Unpack what was packaged and run it, as a user would.
      - name: Smoke test the archive
        shell: bash
        run: |
          name="prsm-${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir unpacked
          if [[ "${{ runner.os }}" == Windows ]]; then
            7z x -bso0 -ounpacked "dist/$name.zip"
            bin="unpacked/$name/prsm.exe"
          else
            tar -xzf "dist/$name.tar.gz" -C unpacked
            bin="unpacked/$name/prsm"
          fi
          "$bin" --version | grep -qx "prsm ${{ needs.check.outputs.version }}"
          "$bin" formats > /dev/null
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: prsm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The macOS app, Apple silicon only (DD-44). It's signed with a Developer
  # ID and notarised only when all six Apple secrets exist (mode.sh);
  # otherwise it's ad hoc, and a partial set fails the job. Each secret
  # reaches only the steps that need it, never the third-party builds.
  app:
    needs: check
    name: Persimmon.app (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Host is Apple silicon
        shell: bash
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = aarch64-apple-darwin

      # Build tools only: every library is built from source, never taken
      # from Homebrew.
      - name: Install build tools
        run: brew install meson ninja cmake pkgconf
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/persimmon-app/ui/package-lock.json

      - name: Install the interface's packages
        working-directory: crates/persimmon-app/ui
        run: npm ci --ignore-scripts

      # The scripts skip what the cached prefix already holds; a change to a
      # pinned source or a build script is a new key, so a fresh build.
      # Restored here and saved straight after the build, so a later step's
      # failure doesn't throw away a half-hour native build.
      - name: Restore the native build
        id: native
        uses: actions/cache/restore@v6
        with:
          path: |
            target/native/prefix
            target/native/sources
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/persimmon-app/packaging/versions.sh', 'crates/persimmon-app/packaging/lib.sh', 'crates/persimmon-app/packaging/build-*.sh') }}

      - name: Build libvips, libarchive and FFmpeg from source
        run: |
          bash crates/persimmon-app/packaging/build-libs.sh
          bash crates/persimmon-app/packaging/build-ffmpeg.sh

      - name: Save the native build
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/native/prefix
            target/native/sources
          key: ${{ steps.native.outputs.cache-primary-key }}

      # The engine's own tests, linked to the libraries the app bundles and
      # with the FFmpeg it bundles first on PATH.
      - name: Test the engine against what the app bundles
        run: |
          P=$PWD/target/native/prefix
          PATH=$P/bin:$PATH PKG_CONFIG_LIBDIR=$P/lib/pkgconfig CARGO_TARGET_DIR=target/native/cargo \
            RUSTFLAGS="-D warnings -C link-arg=-Wl,-rpath,$P/lib" cargo test -p persimmon-core --locked
        env:
          PERSIMMON_REQUIRE_FFMPEG: "1"

      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.3 --features cli
        env:
          RUSTFLAGS: ""

      - name: Signing mode
        id: mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mode=$(bash crates/persimmon-app/packaging/mode.sh)
          echo "signing: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # A keychain of this run's own, holding the Developer ID certificate.
      - name: Import the signing certificate
        if: steps.mode.outputs.mode == 'notarise'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

      # bundle.sh signs with APPLE_SIGNING_IDENTITY when it's set (an absent
      # secret is empty), ad hoc otherwise.
      - name: Build, sign and package the app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash crates/persimmon-app/packaging/bundle.sh target/native dist

      - name: Notarise and staple
        if: steps.mode.outputs.mode == 'notarise'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          cd dist && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256"

      # The app as a tester gets it, from the DMG. With a Developer ID this
      # also checks Gatekeeper and the stapled ticket.
      - name: Check the app inside the DMG
        run: |
          dmg=$(ls dist/*.dmg)
          m=$(mktemp -d)
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$m" "$dmg"
          r=0
          bash crates/persimmon-app/packaging/verify.sh "$m/Persimmon.app" "$dmg" || r=$?
          hdiutil detach -quiet "$m"
          exit $r

      - name: Remove the signing keychain
        if: always() && steps.mode.outputs.mode == 'notarise'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v6
        with:
          name: persimmon-app
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [check, build, app]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/notes.sh "${{ needs.check.outputs.version }}" > notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Persimmon $GITHUB_REF_NAME" --notes-file notes.md dist/*
