# cargo-about configuration: the licence inventory shipped in each release
# archive as THIRD-PARTY-LICENSES.html. `accepted` mirrors the allow-list in
# deny.toml exactly; change both together, and only with the owner's
# approval.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    "bzip2-1.0.6",
    "MIT-0",
]
# The four release targets.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
# Test-only crates never reach a release binary; build scripts can.
ignore-dev-dependencies = true
ignore-build-dependencies = false
